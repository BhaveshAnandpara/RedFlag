<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan results · Redflag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #050505; --ink: #f4f4f2; --muted: #a3a3a3; --faint: #6f6f6f; --line: rgba(255,255,255,0.08); --red: #ff3b3f; --red-ink: #ff5a5f;
    --pass: #3fc07a; --amber: #f2b33d; --panel: #0b0b0b; --sans: "Space Grotesk", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace; --ease: cubic-bezier(0.22, 1, 0.36, 1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: inherit; }
  .mono { font-family: var(--mono); }

  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 36px; height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(5,5,5,0.85); backdrop-filter: blur(8px); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; }
  .brand svg { width: 15px; height: 17px; }
  nav { display: flex; gap: 28px; font-size: 14px; } nav a { color: var(--muted); text-decoration: none; } nav a[aria-current] { color: var(--ink); }

  main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 120px; display: grid; gap: 22px; }
  .titlerow { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .crumb { font-family: var(--mono); font-size: 12px; color: var(--faint); } .crumb a { color: var(--faint); text-decoration: none; }
  h1 { margin: 6px 0 0; font-size: 26px; font-weight: 500; letter-spacing: -0.03em; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13.5px; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; transition: background-color 160ms ease, border-color 160ms ease; }
  .btn.ghost { border: 1px solid var(--line); color: var(--muted); } .btn.ghost:hover { border-color: rgba(255,255,255,0.25); color: var(--ink); }
  .btn.solid { background: var(--ink); color: #000; font-weight: 500; }

  .card { border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 26px 0 2px; }
  .sec-head h2 { margin: 0; font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }
  .sec-head span { font-family: var(--mono); font-size: 12px; color: var(--faint); }

  /* verdict */
  .verdict { padding: 28px 28px 22px; display: grid; gap: 12px; position: relative; overflow: hidden; }
  .verdict::after { content: ""; position: absolute; right: -120px; top: -160px; width: 520px; height: 420px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255,59,63,var(--glow, 0.12)), rgba(255,59,63,0)); }
  .verdict h2 { margin: 0; font-size: clamp(26px, 3vw, 40px); font-weight: 500; letter-spacing: -0.035em; line-height: 1.1; max-width: 22em; }
  .verdict h2 .bad { color: var(--red); }
  .vsub { font-size: 15px; color: var(--muted); }
  .flagrow { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; min-height: 34px; margin-top: 8px; }
  .verdict > * { min-width: 0; }
  .fl { position: relative; width: 15px; height: 34px; display: block; }
  .fl i { position: absolute; left: 0; bottom: 0; width: 2px; height: 100%; border-radius: 1px; background: #3a3a3a; }
  .fl.pass i { transform-origin: bottom; transform: scaleY(0.42); }
  .fl.fail i { background: var(--ink); }
  .fl b { position: absolute; left: 2px; top: 0; width: 12px; height: 9px; background: var(--red); clip-path: polygon(0 0, 100% 0, 76% 50%, 100% 100%, 0 100%);
    transform-origin: left center; transform: scaleX(0); transition: transform 500ms cubic-bezier(0.34, 1.56, 0.64, 1); transition-delay: calc(var(--n) * 60ms + 300ms); }
  .live .fl.fail b { transform: scaleX(1); }
  .fl::after { content: attr(data-tip); position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%); white-space: nowrap; pointer-events: none; z-index: 3;
    background: #1b1b1b; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 4px 8px; font-size: 11.5px; color: var(--ink); opacity: 0; transition: opacity 150ms ease; }
  .fl:hover::after, .fl:focus-visible::after { opacity: 1; }
  .vmeta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 12px; color: var(--faint); margin-top: 6px; }
  .vmeta b { color: var(--muted); font-weight: 500; }
  .vnotes { display: grid; gap: 6px; margin-top: 4px; font-size: 13.5px; color: var(--muted); }
  .vnotes .closing { color: var(--ink); }

  /* fix these first / comparison */
  .fixes { display: grid; gap: 10px; }
  details.item { border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color 200ms ease; }
  details.item[open] { border-color: rgba(255,255,255,0.16); }
  details.item.failed { border-left: 2px solid var(--red); }
  details.item summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; padding: 16px 18px; align-items: start; }
  details.item summary::-webkit-details-marker { display: none; }
  .sev { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 4px; white-space: nowrap; }
  .sev.critical { color: var(--red-ink); background: rgba(255,59,63,0.12); } .sev.high { color: var(--amber); background: rgba(242,179,61,0.12); }
  .sev.medium { color: var(--muted); background: #1c1c1c; } .sev.none { color: var(--faint); background: #151515; }
  .sev.held { color: var(--pass); background: rgba(63,192,122,0.12); }
  .s-title { font-size: 15.5px; } .s-title small { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: 8px; }
  .s-ev { grid-column: 2; font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .s-fix { grid-column: 2; font-size: 13.5px; color: #cfcfcc; } .s-fix b { color: var(--pass); font-weight: 500; margin-right: 6px; }
  .chev { color: var(--faint); transition: transform 200ms ease; font-size: 14px; } details[open] .chev { transform: rotate(90deg); }
  .detail { padding: 4px 18px 20px; display: grid; gap: 14px; border-top: 1px solid var(--line); margin: 0 18px; padding-left: 0; padding-right: 0; }
  .dl { display: grid; gap: 6px; } .dl > span { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .quote { padding: 12px 14px; border-radius: 10px; background: #111; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote.att { background: #1a1a1a; }
  .toollog { border-radius: 10px; background: #070707; border: 1px solid var(--line); }
  .tl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .tl + .tl { border-top: 1px solid rgba(255,255,255,0.05); }
  .tl .call { color: var(--ink); overflow-wrap: anywhere; } .tl .out { color: var(--faint); }
  .tl.harm { background: rgba(255,59,63,0.08); } .tl.harm .out { color: var(--red-ink); } .tl.blocked .out { color: var(--pass); }
  .tl .det { grid-column: 1 / -1; color: var(--faint); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .judges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .jb { border-radius: 10px; border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted); }
  .jb .h { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink); }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 21px; padding: 0 7px; border-radius: 4px; font-family: var(--mono); font-size: 11px; font-weight: 500; white-space: nowrap; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.pass { color: var(--pass); background: rgba(63,192,122,0.12); } .badge.fail { color: var(--red-ink); background: rgba(255,59,63,0.13); }
  .badge.grey { color: var(--muted); background: #1c1c1c; }
  .rulefix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13.5px; } .rulefix div { display: grid; gap: 4px; }
  .rulefix span { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

  /* coverage */
  .cover { padding: 6px 20px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
  .cv { display: grid; grid-template-columns: 52px minmax(0, 1fr) 120px; gap: 10px; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
  .cv .id { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .cv .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cv .bar { display: flex; gap: 3px; height: 7px; } .cv .bar i { flex: 1; border-radius: 2px; background: #4a4a4a; } .cv .bar i.f { background: var(--red); }
  .cv .nt { font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; }
  .cv .ct { grid-column: 3; font-family: var(--mono); font-size: 11px; color: var(--faint); text-align: right; margin-top: -6px; }

  /* all tests */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #000; border-color: var(--ink); }
  .sel { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; color: var(--muted); background: #0b0b0b; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 400; font-size: 12px; color: var(--faint); padding: 10px 14px; border-bottom: 1px solid var(--line); }
  td { padding: 0 14px; height: 46px; border-bottom: 1px solid rgba(255,255,255,0.05); }
  tr.row { cursor: pointer; } tr.row:hover td { background: #0e0e0e; }
  td.mono { color: var(--faint); font-size: 12px; }
  .tablewrap { overflow: hidden; }
  .nomatch { padding: 22px; color: var(--muted); font-size: 14px; }

  /* next + settings */
  .next { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 22px 24px; }
  .next h3 { margin: 0 0 6px; font-size: 19px; font-weight: 500; letter-spacing: -0.02em; } .next p { margin: 0; font-size: 14px; color: var(--muted); }
  .next .btn { height: 42px; padding: 0 18px; border-radius: 999px; justify-content: center; }
  details.settings summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; justify-content: space-between; font-size: 15px; }
  details.settings summary::-webkit-details-marker { display: none; }
  .kv { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 0 20px; padding: 0 20px 18px; font-size: 13.5px; }
  .kv dt { color: var(--faint); font-family: var(--mono); font-size: 12px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); }
  .kv dd { margin: 0; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.05); color: var(--ink); overflow-wrap: anywhere; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: #1b1b1b; border: 1px solid var(--line);
    font-size: 13.5px; transition: opacity 200ms ease, transform 200ms var(--ease); pointer-events: none; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: no-preference) {
    .rise { opacity: 0; transform: translateY(14px); transition: opacity 600ms var(--ease), transform 700ms var(--ease); }
    .rise.in { opacity: 1; transform: none; }
  }
  @media (max-width: 860px) {
    header { gap: 16px; padding: 0 16px; } nav { display: none; }
    main { padding: 24px 16px 96px; }
    .actions { margin-left: 0; width: 100%; } .actions .btn { flex: 1; justify-content: center; }
    .verdict { padding: 22px 18px; } .flagrow { gap: 7px; } .fl { width: 12px; }
    .judges, .rulefix { grid-template-columns: 1fr; }
    .cover { grid-template-columns: 1fr; padding: 4px 16px; }
    .cv { grid-template-columns: 48px minmax(0, 1fr) 90px; }
    .t-risk, .t-model { display: none; }
    .next { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 1fr; } .kv dt { padding-bottom: 0; } .kv dd { border-top: 0; padding-top: 2px; }
    details.item summary { grid-template-columns: auto minmax(0, 1fr); } .chev { display: none; }
  }

  .qpanel { padding: 20px; display: grid; gap: 14px; }
  .qpanel p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; max-width: 60ch; }
  .qrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .qin { height: 40px; min-width: 260px; flex: 1; max-width: 380px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: #0c0c0c; color: var(--ink); font: inherit; font-size: 14px; outline: none; }
  .qin:focus { border-color: rgba(255,255,255,0.4); }
  .qpanel .btn.solid:disabled { opacity: 0.35; cursor: not-allowed; }
  .qpanel .btn.small { height: 32px; font-size: 12.5px; }
  .qstatus { font-size: 13px; color: var(--muted); } .qstatus code, .tokenbox code { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .code { margin: 0; padding: 14px 16px; border-radius: 10px; background: #070707; border: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; color: #d6d6d3; overflow-x: auto; }
  .tokenbox { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px; background: #0d1a12; border: 1px solid rgba(63,192,122,0.3); margin-bottom: 6px; overflow-x: auto; }
  .tailor { margin: 18px 0 0; font-size: 15px; color: var(--muted); } .tailor a { color: var(--ink); }
  @media (max-width: 860px) { .qin { min-width: 0; max-width: none; } }

  /* the MCP check report */
  .badge.unclear { color: var(--amber); background: rgba(242,179,61,0.12); }
  .fl.grey i { background: #5a4a26; transform-origin: bottom; transform: scaleY(0.42); }
  .touched { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .called { padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
  .called h3 { margin: 0; font-size: 15px; font-weight: 500; } .called h3 small { color: var(--faint); font-weight: 400; margin-left: 6px; font-family: var(--mono); font-size: 12px; }
  .called p { margin: 0; font-size: 13px; color: var(--muted); }
  .called ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .called li { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; background: #141414; color: var(--muted); }
  .called li.on { color: var(--ink); background: #1a1a1a; } .called li.chg::after { content: " · changes"; color: var(--amber); }
  .quote.mono { font-family: var(--mono); font-size: 12.5px; }
  @media (max-width: 860px) { .touched { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="home.html"><svg viewBox="0 0 16 18" aria-hidden="true"><rect width="2" height="18" fill="#f4f4f2"/><path d="M2 1h13l-3 4 3 4H2z" fill="#ff3b3f"/></svg>Redflag</a>
  <nav aria-label="Main"><a href="home.html#scene">How it works</a><a href="scan.html">Scan</a><a href="#" aria-current="page">Results</a><a href="https://github.com/BhaveshAnandpara/RedFlag#readme" target="_blank" rel="noopener">Docs</a></nav>
</header>

<main id="main"></main>
<div class="toast" id="toast" role="status"></div>

<script src="scan-data.js"></script>
<script src="mcp-data.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), key = q.get('scan') === 'hardened' ? 'hardened' : 'weak', other = key === 'weak' ? 'hardened' : 'weak';
  if (q.get('mode') === 'mcp') return; // the MCP check has its own report, below
  const quick = q.get('mode') === 'quick'; // a quick scan of the visitor's own bot: the AI judge decides every result
  const M = SCAN_META[key], T = SCAN_DATA[key], label = { weak: 'Weak bot', hardened: 'Protected bot' };
  const RISKS = [['LLM01', 'Prompt injection'], ['LLM02', 'Sensitive information disclosure'], ['LLM03', 'Supply chain'], ['LLM04', 'Data and model poisoning'],
    ['LLM05', 'Improper output handling'], ['LLM06', 'Excessive agency'], ['LLM07', 'System prompt leakage'], ['LLM08', 'Vector and embedding weaknesses'],
    ['LLM09', 'Misinformation'], ['LLM10', 'Unbounded consumption']];
  const SEV = { critical: 0, high: 1, medium: 2 };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // counts, all computed from the tests
  const attacks = T.filter(t => t.kind === 'negative'), normal = T.filter(t => t.kind === 'positive');
  const failed = attacks.filter(t => t.status === 'fail').sort((a, b) => SEV[a.sev] - SEV[b.sev]);
  const crit = failed.filter(t => t.sev === 'critical').length, normalOk = normal.filter(t => t.status === 'pass').length;
  const tested = new Set(T.map(t => t.risk).filter(Boolean)), untested = RISKS.filter(([id]) => !tested.has(id)).length;
  const wilson = (k, n, z = 1.96) => { const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [Math.max(0, c - h), Math.min(1, c + h)]; };
  const [lo, hi] = wilson(failed.length, attacks.length), pct = v => Math.round(v * 100) + '%';
  const harmful = t => tl => t.status === 'fail' && tl.outcome === 'executed' && (t.evidence.includes(tl.tool) || (tl.tool === 'lookup_order' && t.risk === 'LLM02'));

  function detail(t) {
    if (quick) return `<div class="detail">
      <div class="dl"><span>Message sent</span><div class="quote att">${esc(t.msg)}</div></div>
      <div class="dl"><span>Your bot's reply</span><div class="quote">${esc(t.reply)}</div></div>
      <div class="dl"><span>Tool log</span><div class="quote" style="color:var(--faint)">None. Redflag can only see your bot's replies, not what it did behind them.</div></div>
      <div class="jb"><div class="h">AI judge <span class="badge ${t.status}">${t.status.toUpperCase()}</span></div>${esc(t.evidence.replace(' or the tool log', ''))}<span style="font-size:12px;color:var(--faint)">The AI judge read the reply against your rule. It has not been checked for accuracy. (Prototype: the recorded evidence stands in for the judge's reason.)</span></div>
      <div class="rulefix"><div><span>Rule</span>${esc(t.rule)}</div><div><span>How to fix</span>${esc(t.fix || '—')}</div></div>
    </div>`;
    const tools = t.tools.length ? `<div class="toollog">${t.tools.map(tl => `<div class="tl ${harmful(t)(tl) ? 'harm' : ''} ${tl.outcome === 'blocked' ? 'blocked' : ''}"><span class="call">${esc(tl.tool)}(${esc(tl.args)})</span><span class="out">${esc(tl.outcome)}${harmful(t)(tl) ? ' · the harm' : ''}</span>${tl.detail ? `<span class="det">${esc(tl.detail.slice(0, 220))}${tl.detail.length > 220 ? '…' : ''}</span>` : ''}</div>`).join('')}</div>` : '<div class="quote" style="color:var(--faint)">No tools were called.</div>';
    return `<div class="detail">
      <div class="dl"><span>Message sent</span><div class="quote att">${esc(t.msg)}</div></div>
      <div class="dl"><span>Bot's reply</span><div class="quote">${esc(t.reply)}</div></div>
      <div class="dl"><span>Tool log</span>${tools}</div>
      <div class="judges">
        <div class="jb"><div class="h">Plain rules <span class="badge ${t.status}">${t.status.toUpperCase()}</span></div>${esc(t.evidence)}</div>
        <div class="jb"><div class="h">AI judge <span class="badge grey">NOT RUN</span></div>The AI judge did not run on this test. It was added after this scan was recorded.</div>
      </div>
      <div class="rulefix"><div><span>Rule</span>${esc(t.rule)}</div><div><span>How to fix</span>${esc(t.fix || '—')}</div></div>
      <div class="dl"><span>Answered by ${esc(t.model)}</span></div>
    </div>`;
  }
  const sevTag = s => `<span class="sev ${s || 'none'}">${s || 'not rated'}</span>`;

  const head = failed.length
    ? `<span class="bad">${failed.length} of ${attacks.length}</span> attacks got through. ${crit} ${crit === 1 ? 'was' : 'were'} critical.`
    : `0 of ${attacks.length} attacks got through. ${untested} of 10 risks were not tested.`;

  const fixesHTML = failed.length
    ? failed.map(t => `<details class="item failed" id="t-${t.id}"><summary>${sevTag(t.sev)}<span class="s-title">${esc(t.title)}<small>${t.risk}</small></span><span class="chev">›</span><span class="s-ev">${esc(t.evidence)}</span><span class="s-fix"><b>Fix</b>${esc(t.fix)}</span></summary>${detail(t)}</details>`).join('')

<script>

  function table() {
    const kind = document.getElementById('f-kind').value, tool = document.getElementById('f-tool').value, sev = document.getElementById('f-sev').value;
    const rows = R.filter(r => (fRes === 'all' || r.status === fRes) && (!kind || r.group === kind) && (!tool || r.tool === tool) && (!sev || r.severity === sev));
    document.getElementById('t-count').textContent = `${rows.length} of ${R.length} checks`;
    document.getElementById('tbody').innerHTML = rows.length ? rows.map(r => `<tr class="row" data-id="${r.test_id}"><td>${badge(r.status)}</td><td>${esc(r.title)}</td><td class="mono t-risk">${r.risk}</td><td>${r.status === 'pass' && r.group === 'static' ? sevTag('') : sevTag(r.severity)}</td><td class="mono t-model">${decider(r)}</td></tr><tr class="exp" data-for="${r.test_id}" hidden><td colspan="5">${detail(r)}</td></tr>`).join('')
      : `<tr><td colspan="5" class="nomatch">No checks match those filters.</td></tr>`;
    document.querySelectorAll('tr.row').forEach(row => row.addEventListener('click', () => { const e = document.querySelector(`tr.exp[data-for="${row.dataset.id}"]`); e.hidden = !e.hidden; }));
  }
  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => { fRes = c.dataset.f; document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c)); table(); }));
  ['f-kind', 'f-tool', 'f-sev'].forEach(id => document.getElementById(id).addEventListener('change', table));
  table();

  // a flag opens its finding, or its row in the table
  document.querySelectorAll('.fl').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const id = a.getAttribute('href').slice(1), d = document.getElementById(id);
    if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    fRes = 'all'; document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.f === 'all')); ['f-kind', 'f-tool', 'f-sev'].forEach(i => { document.getElementById(i).value = ''; }); table();
    const row = document.querySelector(`tr.row[data-id="${id.slice(2)}"]`); if (row) { row.click(); row.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }));

  const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); };
  document.getElementById('copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); toast('Link copied'); } catch { toast('Copy failed'); } });
  document.getElementById('dl').addEventListener('click', () => {
    const md = [`# Redflag MCP check #${META.id} · ${SERVER.name}`, '', head.replace(/<[^>]+>/g, ''), '', `Server ${SERVER.host} · checked ${META.started} · ${META.duration} s · AI judge ${META.judge}`, '',
      `## Called`, ...(ticked.length ? ticked.map(n => `- ${n} (${called[n] === 'changes' ? 'changes things' : 'only reads'})`) : ['None.']), '',
      '## Failures', ...(failed.length ? failed.flatMap(r => [`### ${r.title} (${r.risk}, ${r.severity})`, `- What was found: ${r.group === 'call' ? `${r.message}. It sent back: ${r.reply.slice(0, 300)}` : r.evidence}`, ...(r.group === 'call' ? [`- AI judge: ${r.judge_reason}`] : []), `- Rule: ${r.rule}`, `- How to fix: ${r.remediation}`, '']) : ['None in this check.', '']),
      '## All checks', ...R.map(r => `- ${BADGE[r.status][1]} ${r.title}`), '',
      'This is a check of an MCP server. The description and schema checks use plain rules that look for known patterns. Redflag only called the tools you ticked, and an AI judge read what each tool sent back. The AI judge has not been checked for accuracy.', '',
      'This is not a guarantee of security. It only reports what these tests checked.'].join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' })); a.download = `redflag-mcp-check-${META.id}.md`; a.click(); URL.revokeObjectURL(a.href);
  });

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.08 });
  document.querySelectorAll('.rise').forEach((el, i) => { el.style.transitionDelay = `${Math.min(i, 4) * 70}ms`; io.observe(el); });
  requestAnimationFrame(() => document.getElementById('flagrow').classList.add('live'));
  document.title = `${SERVER.name} · MCP check #${META.id} · Redflag`;
  document.querySelector('nav a[href="scan.html"]').outerHTML = '<a href="mcp.html">MCP check</a>';
})();
</script>
</body>
</html>
