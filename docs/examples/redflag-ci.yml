# Run your Redflag tests on every push to main and every morning, and fail the build when a test
# fails at or above the chosen level. Put the three values in the repository's secrets:
#   REDFLAG_URL         the address of your Redflag backend
#   REDFLAG_TOKEN       an API token made on the Redflag setup page (it is shown only once)
#   REDFLAG_TARGET_KEY  your bot's own key, if it needs one
name: Redflag

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC: the free host sleeps, so the schedule lives here
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: BhaveshAnandpara/RedFlag/.github/actions/redflag-scan@main
        with:
          url: ${{ secrets.REDFLAG_URL }}
          token: ${{ secrets.REDFLAG_TOKEN }}
          target-key: ${{ secrets.REDFLAG_TARGET_KEY }}
          fail-on: high
