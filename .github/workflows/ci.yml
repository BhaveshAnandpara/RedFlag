name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redflag
          POSTGRES_PASSWORD: redflag
          POSTGRES_DB: redflag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redflag"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q

  # The unit tests run with test-only packages installed, so they cannot notice a package that
  # the real container is missing. This builds the production image and checks it starts.
  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t redflag-backend backend
      - name: The production image must be able to start
        run: >
          docker run --rm
          -e DATABASE_URL=postgresql://user:pass@localhost:5432/db
          -e FRONTEND_ORIGIN=http://localhost:3000
          redflag-backend
          python -c "import redflag_backend.main"
      - name: The production image must carry the bots and load them without errors
        run: >
          docker run --rm
          redflag-backend
          python -c "from redflag_backend.sandbox.loader import load_bots; r = load_bots(); assert not r.errors, r.errors; assert {'acme-weak', 'acme-hardened'} <= set(r.bots), sorted(r.bots)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - run: pnpm check:bundle

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
